<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="larger_box">
        <input class="city-input" placeholder="Digite o nome da cidade" />

            <img class="search-icon" src="https://www.svgrepo.com/show/488200/find.svg" alt="busca">
        </button>


        <div class="average-box">
            <h2 class="city-name">tempo em São Paulo</h2>

            <p class="temp">21°C</p>



            <div class="smaller-box">
                <img class="img_weather" alt="tempo" src="https://openweathermap.org/img/wn/04n.png">
                <p class="weather-description">nublado
            </div>
            <p>

            <p class="humidity">Umidade: 80%</p>

        </div>
    </div>
    </div>
